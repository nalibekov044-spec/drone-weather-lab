name: Build release downloads

on:
  push:
    tags: ['v0.96*', 'v0.9.6*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  downloads:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build offline HTML
        run: node scripts/build-standalone.mjs
      - name: Build and check Windows launcher
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Package download
        shell: pwsh
        run: |
          Compress-Archive -Path Drone-Weather-Lab-0.96.0-Beta.html, README.md, README.en.md, Start.cmd, docs -DestinationPath artifacts/Drone-Weather-Lab-0.96.0-Beta-portable.zip
      - name: Save downloads
        uses: actions/upload-artifact@v4
        with:
          name: Drone-Weather-Lab-0.96.0-Beta
          path: |
            artifacts/Drone-Weather-Lab-0.96.0-Beta.exe
            artifacts/Drone-Weather-Lab-0.96.0-Beta-portable.zip
            Drone-Weather-Lab-0.96.0-Beta.html
      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title 'Drone Weather Lab 0.96.0 Beta' --notes-file RELEASE.en.md --prerelease }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }
          gh release upload $env:GITHUB_REF_NAME artifacts/Drone-Weather-Lab-0.96.0-Beta.exe artifacts/Drone-Weather-Lab-0.96.0-Beta-portable.zip Drone-Weather-Lab-0.96.0-Beta.html --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the release files.' }
